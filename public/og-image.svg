<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#0f1f3d" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee" />
      <stop offset="100%" style="stop-color:#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#22d3ee" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
  </g>

  <!-- Right-side decorative circles -->
  <circle cx="920" cy="315" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.5" />
  <circle cx="920" cy="315" r="130" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.3" />
  <circle cx="920" cy="315" r="80" fill="#22d3ee" opacity="0.04" />
  <circle cx="920" cy="135" r="6" fill="#22d3ee" opacity="0.8" />
  <circle cx="920" cy="495" r="6" fill="#a855f7" opacity="0.8" />
  <!-- Glow blobs -->
  <circle cx="1050" cy="200" r="100" fill="#22d3ee" opacity="0.07" filter="url(#softglow)" />
  <circle cx="850" cy="430" r="80" fill="#a855f7" opacity="0.07" filter="url(#softglow)" />
  <!-- Small star dots -->
  <circle cx="750" cy="100" r="2" fill="white" opacity="0.5" />
  <circle cx="810" cy="200" r="1.5" fill="white" opacity="0.4" />
  <circle cx="680" cy="300" r="2" fill="white" opacity="0.3" />
  <circle cx="780" cy="500" r="1.5" fill="white" opacity="0.4" />
  <circle cx="1100" cy="350" r="2" fill="white" opacity="0.5" />
  <circle cx="1020" cy="500" r="1.5" fill="#22d3ee" opacity="0.6" />

  <!-- Left border accent line -->
  <rect x="0" y="0" width="5" height="630" fill="url(#textGrad)" opacity="0.8" />

  <!-- Name -->
  <text x="90" y="230" font-family="Georgia, serif" font-size="76" font-weight="bold" fill="white" letter-spacing="-1">Prem Shankar Rai</text>

  <!-- Gradient title -->
  <text x="90" y="305" font-family="Georgia, serif" font-size="38" font-weight="normal" fill="url(#textGrad)" letter-spacing="2">Full Stack Developer</text>

  <!-- Divider line -->
  <line x1="90" y1="335" x2="620" y2="335" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.5" />

  <!-- Skill pills -->
  <!-- React -->
  <rect x="90" y="358" width="130" height="42" rx="21" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.7" />
  <text x="155" y="384" font-family="Arial, sans-serif" font-size="18" fill="#22d3ee" text-anchor="middle" opacity="0.9">React.js</text>

  <!-- Node.js -->
  <rect x="238" y="358" width="130" height="42" rx="21" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.7" />
  <text x="303" y="384" font-family="Arial, sans-serif" font-size="18" fill="#22d3ee" text-anchor="middle" opacity="0.9">Node.js</text>

  <!-- MongoDB -->
  <rect x="386" y="358" width="140" height="42" rx="21" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7" />
  <text x="456" y="384" font-family="Arial, sans-serif" font-size="18" fill="#a855f7" text-anchor="middle" opacity="0.9">MongoDB</text>

  <!-- TypeScript -->
  <rect x="544" y="358" width="150" height="42" rx="21" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7" />
  <text x="619" y="384" font-family="Arial, sans-serif" font-size="18" fill="#a855f7" text-anchor="middle" opacity="0.9">TypeScript</text>

  <!-- Tagline / description -->
  <text x="90" y="460" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" letter-spacing="0.5">Building scalable, user-centric web experiences</text>

  <!-- URL at bottom -->
  <text x="90" y="580" font-family="Arial, monospace, sans-serif" font-size="20" fill="#475569" letter-spacing="1">premportfolio.me</text>

  <!-- Dot before URL -->
  <circle cx="70" cy="574" r="4" fill="url(#textGrad)" />

  <!-- Top and bottom border glow lines -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#textGrad)" stroke-width="2" opacity="0.4" />
  <line x1="0" y1="628" x2="1200" y2="628" stroke="url(#textGrad)" stroke-width="2" opacity="0.4" />
</svg>

